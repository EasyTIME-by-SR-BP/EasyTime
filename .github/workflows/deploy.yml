name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Which part should be deployed?"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - web
          - nginx
          - db
      ref:
        description: "Git branch or tag to deploy"
        required: true
        default: "main"
        type: string
      reset_database:
        description: "Reset MariaDB and load demo seed data"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            REPO_DIR=/home/easytime/EasyTime
            REPO_URL=git@github.com:EasyTIME-by-SR-BP/EasyTime.git
            REF="${{ inputs.ref }}"
            ENV_BACKUP=/tmp/easytime.env.bak

            if [ -f "$REPO_DIR/.env" ]; then
              cp "$REPO_DIR/.env" "$ENV_BACKUP"
            fi

            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              GIT_SSH_COMMAND="ssh -i ~/.ssh/github_easytime_deploy -o IdentitiesOnly=yes" \
                git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git remote set-url origin "$REPO_URL"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/github_easytime_deploy -o IdentitiesOnly=yes" \
              git fetch origin "$REF"
            git reset --hard FETCH_HEAD
            git clean -fd -e .env

            if [ -f "$ENV_BACKUP" ]; then
              cp "$ENV_BACKUP" "$REPO_DIR/.env"
            fi

            bash scripts/generate-self-signed-cert.sh

            ENV_FILE="$REPO_DIR/.env"
            touch "$ENV_FILE"

            read_env() {
              grep -E "^$1=" "$ENV_FILE" 2>/dev/null | cut -d= -f2- | tr -d '\r' || true
            }

            pick_env() {
              local key="$1"
              local gh_value="$2"
              local default_value="$3"
              local old
              old="$(read_env "$key")"
              if [ -n "$old" ]; then
                printf '%s' "$old"
              elif [ -n "$gh_value" ]; then
                printf '%s' "$gh_value"
              else
                printf '%s' "$default_value"
              fi
            }

            DB_PASSWORD="$(pick_env DB_PASSWORD '${{ secrets.DB_PASSWORD }}' '')"
            MYSQL_ROOT_PASSWORD="$(pick_env MYSQL_ROOT_PASSWORD '${{ secrets.MYSQL_ROOT_PASSWORD }}' '')"

            APP_URL="$(pick_env APP_URL '${{ vars.APP_URL }}' '')"
            MAIL_ENABLED="$(pick_env MAIL_ENABLED '${{ vars.MAIL_ENABLED }}' 'false')"
            MAIL_FROM_ADDRESS="$(pick_env MAIL_FROM_ADDRESS '${{ vars.MAIL_FROM_ADDRESS }}' '')"
            MAIL_FROM_NAME="$(pick_env MAIL_FROM_NAME '${{ vars.MAIL_FROM_NAME }}' 'EasyTime')"
            MAIL_HOST="$(pick_env MAIL_HOST '${{ vars.MAIL_HOST }}' '')"
            MAIL_PORT="$(pick_env MAIL_PORT '${{ vars.MAIL_PORT }}' '')"
            MAIL_USERNAME="$(pick_env MAIL_USERNAME '${{ secrets.MAIL_USERNAME }}' '')"
            MAIL_PASSWORD="$(pick_env MAIL_PASSWORD '${{ secrets.MAIL_PASSWORD }}' '')"
            MAIL_ENCRYPTION="$(pick_env MAIL_ENCRYPTION '${{ vars.MAIL_ENCRYPTION }}' 'tls')"
            MAIL_SMTP_AUTH="$(pick_env MAIL_SMTP_AUTH '${{ vars.MAIL_SMTP_AUTH }}' 'true')"
            MAIL_NOTIFY_TASKS="$(pick_env MAIL_NOTIFY_TASKS '${{ vars.MAIL_NOTIFY_TASKS }}' 'true')"
            MAIL_NOTIFY_INFO="$(pick_env MAIL_NOTIFY_INFO '${{ vars.MAIL_NOTIFY_INFO }}' 'false')"

            cat > "$ENV_FILE" <<EOF
            APP_PORT=8080
            HTTP_PORT=80
            HTTPS_PORT=445
            DB_DRIVER=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=easytime
            DB_USERNAME=easytime
            DB_PASSWORD=${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            APP_URL=${APP_URL}
            MAIL_ENABLED=${MAIL_ENABLED}
            MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME=${MAIL_FROM_NAME}
            MAIL_HOST=${MAIL_HOST}
            MAIL_PORT=${MAIL_PORT}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
            MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH}
            MAIL_NOTIFY_TASKS=${MAIL_NOTIFY_TASKS}
            MAIL_NOTIFY_INFO=${MAIL_NOTIFY_INFO}
            EOF

            run_compose() {
              sg docker -c "docker compose -f docker-compose.yml -f docker-compose.prod.yml $*"
            }
            TARGET="${{ inputs.deploy_target }}"

            if [ "$TARGET" = "full" ]; then
              run_compose up -d --build
              run_compose restart nginx || true
              if [ "${{ inputs.reset_database }}" = "true" ]; then
                echo "Resetting MariaDB and loading demo seed..."
                run_compose exec -T web php scripts/seed-mariadb.php
              fi
            elif [ "$TARGET" = "web" ]; then
              run_compose up -d --build web
              run_compose restart nginx || true
            elif [ "$TARGET" = "nginx" ]; then
              run_compose up -d --build nginx
              run_compose restart nginx
            elif [ "$TARGET" = "db" ]; then
              run_compose up -d --build db
            else
              echo "Unknown deploy target: $TARGET"
              exit 1
            fi

      - name: Notify deployment complete
        run: |
          echo "Deployed '${{ inputs.deploy_target }}' from ref '${{ inputs.ref }}' via git pull on server"
